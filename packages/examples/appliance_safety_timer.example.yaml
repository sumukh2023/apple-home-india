# --- packages/appliance_safety_timer.example.yaml ---
# A geyser (water heater) that switches itself off 1 hour after being turned on,
# even across Home Assistant restarts. Replace switch.bedroom_geyser with your plug.

timer:
  bedroom_geyser_auto_off:
    name: Bedroom geyser auto-off
    duration: "01:00:00"
    restore: true            # required: resumes the countdown after a restart

automation:
  - id: bedroom_geyser_safety_timer
    alias: "Bedroom geyser - 1 h safety cut-off"
    use_blueprint:
      path: sumukh2023/appliance_safety_timer.yaml
      input:
        appliance: switch.bedroom_geyser
        countdown: timer.bedroom_geyser_auto_off
        max_on_time:
          hours: 1
          minutes: 0
          seconds: 0
        # Optional extra layers (docs/07-local-control.md, section 3.5). Delete
        # these two lines if your plug is on the cloud only or has no countdown.
        # A second switch for the same plug, e.g. its cloud Tuya entity:
        backup_switch: [switch.bedroom_geyser_cloud]
        # The plug's own countdown (Tuya Local "… Timer"); armed at 1 h 05:
        hardware_countdown: [time.bedroom_geyser_timer]

name: Bug report
description: Something in a blueprint, script, example or guide doesn't work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - IR AC bridge blueprint
        - Appliance safety timer blueprint
        - ir_send script / IR and RF codes
        - Fan or curtain example
        - Setup guide or other docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or automation trace
      description: Settings → System → Logs, or the automation's trace. Remove keys, IDs and IP addresses first.
      render: text
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.10.1"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I haven't included local keys, device IDs, IP addresses or my Tuya user code.
          required: true
